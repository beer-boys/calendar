[versions]
kotlin = "2.0.10"
detekt = "1.23.7"
testcontainers = "2.0.1"
jjwt = "0.13.0"
springdoc = "2.8.8"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }

spring-boot = { id = "org.springframework.boot", version = "3.4.5" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.0" }

detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8"  }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect"  }

spring-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-starter-data-jdbc = { module = "org.springframework.boot:spring-boot-starter-data-jdbc" }
spring-starter-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client" }
spring-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-starter-email = { module = "org.springframework.boot:spring-boot-starter-mail" }
spring-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

springdoc-openapi-starter = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

fasterxml-jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }

jjwt-api = { group = "io.jsonwebtoken", name = "jjwt-api", version.ref = "jjwt" }
jjwt-impl = { group = "io.jsonwebtoken", name = "jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { group = "io.jsonwebtoken", name = "jjwt-jackson", version.ref = "jjwt" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }

mockk = { module = "io.mockk:mockk", version = "1.14.6" }
spring-mockk = { module = "com.ninja-squad:springmockk", version = "4.0.2" }
awaitility-kotlin = { module = "org.awaitility:awaitility-kotlin", version = "4.3.0" }

testcontainers = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgres = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }

detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
liquibase-core = { module = "org.liquibase:liquibase-core" }

postgresql = { module = "org.postgresql:postgresql" }

[bundles]
jjwt = ["jjwt-api", "jjwt-impl", "jjwt-jackson"]
